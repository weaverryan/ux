name: Symfony UX

on: [push, pull_request]

env:
    DEFAULT_PHP_VERSION: '8.0'

jobs:
    coding-style-php:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@master
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.DEFAULT_PHP_VERSION }}
            - name: php-cs-fixer
              run: |
                  wget https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v2.18.2/php-cs-fixer.phar -q
                  php php-cs-fixer.phar fix --dry-run --diff

    coding-style-js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@master
            - run: yarn
            - run: yarn check-lint
            - run: yarn check-format

    provide_php_matrix_output:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@master
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.DEFAULT_PHP_VERSION }}
            -   id: set-matrix
                run: echo "::set-output name=matrix::$(php .github/get-php-matrix.php)"

    test-php-lowest-deps:
        name: "${{ matrix.name }} on ${{ matrix.php_version }} lowest"
        needs: provide_php_matrix_output
        runs-on: ubuntu-latest
        strategy:
            matrix: ${{ fromJson(needs.provide_php_matrix_output.outputs.matrix) }}
        steps:
            - uses: actions/checkout@master
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php_version }}
            - name: Build Cross Packages
              run: |
                  php .github/build-packages.php
            - name: Download Dependencies
                  cd ${{ matrix.path }}
                  composer update --prefer-lowest --prefer-dist --no-interaction --no-ansi --no-progress
            - name: Run tests
                  cd ${{ matrix.path }}
                  php vendor/bin/simple-phpunit

    tests-js:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@master
            - run: yarn
            - run: yarn test
